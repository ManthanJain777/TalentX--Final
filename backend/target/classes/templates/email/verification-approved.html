<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verification Approved – TALENTX</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F3E8; margin: 0; padding: 40px 20px; }
        .container { max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(20,37,68,0.06); }
        .footer { text-align: center; font-size: 12px; color: #93979F; padding-top: 24px; border-top: 1px solid rgba(20,37,68,0.06); }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center; margin-bottom:20px;">
            <div style="width:48px; height:48px; border-radius:50%; background:#1D8A5F; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:white; font-size:24px;">✓</div>
        </div>
        
        <h2 style="text-align:center; font-family:'Georgia',serif; font-size:20px; color:#142544;">Verification Approved!</h2>
        <p style="color:#585D68; font-size:15px; text-align:center;">
            Hi <strong th:text="${userName}">Name</strong>, your <strong th:text="${verificationType}">Identity</strong> verification has been successfully approved!
        </p>

        <div class="footer">
            <p>© <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
