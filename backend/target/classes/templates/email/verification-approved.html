<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
 <title>Verification Approved – TALENTX</title>
 <style>
 body { font-family: 'Inter', sans-serif; background: #050505; margin: 0; padding: 40px 20px; }
 .container { max-width: 520px; margin: 0 auto; background: #0A0A0B; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(199,168,104,0.15); }
 .footer { text-align: center; font-size: 12px; color: #71717A; padding-top: 24px; border-top: 1px solid rgba(199,168,104,0.15); }
 </style>
</head>
<body>
 <div class="container">
 <div style="text-align:center; margin-bottom:20px;">
 <div style="width:48px; height:48px; border-radius:50%; background:#1D8A5F; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:white; font-size:24px;"></div>
 </div>
 
 <h2 style="text-align:center; font-family: 'Inter', sans-serif, monospace; font-size:20px; color: #FFFFFF;">Verification Approved!</h2>
 <p style="color: #A1A1AA; font-size:15px; text-align:center;">
 Hi <strong th:text="${userName}">Name</strong>, your <strong th:text="${verificationType}">Identity</strong> verification has been successfully approved!
 </p>

 <div class="footer">
 <p> <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
 </div>
 </div>
</body>
</html>
