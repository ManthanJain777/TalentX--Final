<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Milestone Approved – TALENTX</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F3E8; margin: 0; padding: 40px 20px; }
        .container { max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(20,37,68,0.06); border: 1px solid rgba(20,37,68,0.06); }
        .amount-box { background: linear-gradient(135deg, #142544, #0D1930); border-radius: 16px; padding: 24px; text-align: center; margin: 24px 0; }
        .amount { font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; color: #C7A868; }
        .btn { display: inline-block; background: #8B6B23; color: white !important; padding: 12px 32px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .footer { text-align: center; font-size: 12px; color: #93979F; padding-top: 24px; border-top: 1px solid rgba(20,37,68,0.06); }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center; margin-bottom:20px;">
            <div style="width:48px; height:48px; border-radius:50%; border:2px solid #C7A868; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; background:#142544;">
                <div style="width:14px; height:14px; border-radius:50%; background:#C7A868;"></div>
            </div>
            <h2 style="font-family:'Georgia',serif; font-weight:700; font-size:24px; margin:0; color:#142544;">TALENT<span style="color:#8B6B23;">X</span></h2>
        </div>

        <h2 style="font-family:'Georgia',serif; font-size:20px; color:#142544;">✅ Milestone Approved!</h2>
        <p style="color:#585D68; font-size:15px;">
            Great work, <strong th:text="${freelancerName}">Anika</strong>! The milestone for <strong th:text="${projectTitle}">Project</strong> has been approved.
        </p>

        <div style="border-left:4px solid #1D8A5F; padding:12px 16px; background:#FBF8F1; border-radius:8px; margin:16px 0;">
            <p style="margin:0; font-size:14px; color:#585D68;">
                <strong>Milestone:</strong> <span th:text="${milestoneTitle}">Design Architecture</span><br>
                <strong>Project Status:</strong> <span th:text="${projectStatus}">ACTIVE</span>
            </p>
        </div>

        <div class="amount-box">
            <p style="color:#C7A868; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">Funds Released</p>
            <div class="amount" th:text="${amount}">$2,900</div>
            <p style="color:#93979F; font-size:12px; margin-top:8px;">
                Total Budget: <span th:text="${totalBudget}">$5,000</span>
            </p>
        </div>

        <div style="text-align:center; margin-top:20px;">
            <a href="#" th:href="${projectLink}" class="btn">📊 View Project Workspace</a>
        </div>

        <div class="footer">
            <p>© <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
