<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Challenge Winner – TALENTX</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F3E8; margin: 0; padding: 40px 20px; }
        .container { max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(20,37,68,0.06); border: 1px solid rgba(20,37,68,0.06); }
        .footer { text-align: center; font-size: 12px; color: #93979F; padding-top: 24px; border-top: 1px solid rgba(20,37,68,0.06); }
        .amount-box { background: linear-gradient(135deg, #8B6B23, #C7A868); border-radius: 16px; padding: 24px; text-align: center; margin: 24px 0; }
        .amount { font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; color: #142544; }
        .btn { display: inline-block; background: #142544; color: white !important; padding: 12px 32px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="font-family:'Georgia',serif; font-size:24px; color:#142544; text-align:center;">🏆 You Won!</h2>
        <p style="color:#585D68; font-size:15px; text-align:center;">
            Congratulations <strong th:text="${candidateName}">Candidate</strong>! You have been selected as the winner for <strong th:text="${challengeTitle}">Challenge</strong> by <strong th:text="${employerName}">Employer</strong>.
        </p>

        <div class="amount-box">
            <p style="color:#142544; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">Prize Amount</p>
            <div class="amount" th:text="${prizeAmount}">$500</div>
        </div>

        <div style="text-align:center; margin-top:20px;">
            <a href="#" th:href="${challengeLink}" class="btn">View Challenge Details</a>
        </div>

        <div class="footer">
            <p>© <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
