<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
 <title>Escrow Release – TALENTX</title>
 <style>
 body { font-family: 'Inter', sans-serif; background: #050505; margin: 0; padding: 40px 20px; }
 .container { max-width: 520px; margin: 0 auto; background: #0A0A0B; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(199,168,104,0.15); border: 1px solid rgba(199,168,104,0.15); }
 .footer { text-align: center; font-size: 12px; color: #71717A; padding-top: 24px; border-top: 1px solid rgba(199,168,104,0.15); }
 .amount-box { background: linear-gradient(135deg, #142544, #0D1930); border-radius: 16px; padding: 24px; text-align: center; margin: 24px 0; }
 .amount { font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; color: #C7A868; }
 </style>
</head>
<body>
 <div class="container">
 <h2 style="font-family: 'Inter', sans-serif, monospace; font-size:20px; color: #FFFFFF;"> Escrow Released!</h2>
 <p style="color: #A1A1AA; font-size:15px;">
 Hi <strong th:text="${employerName}">Employer</strong>, you have successfully released funds to <strong th:text="${freelancerName}">Freelancer</strong> for <strong th:text="${projectTitle}">Project</strong>.
 </p>

 <div class="amount-box">
 <p style="color:#C7A868; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">Amount Released</p>
 <div class="amount" th:text="${amount}">$2,900</div>
 </div>

 <div class="footer">
 <p> <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
 </div>
 </div>
</body>
</html>
