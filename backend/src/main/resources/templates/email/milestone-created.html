<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
 <title>Milestone Created – TALENTX</title>
 <style>
 body { font-family: 'Inter', -apple-system, sans-serif; background: #FFFFF0; margin: 0; padding: 40px 20px; }
 .container { max-width: 520px; margin: 0 auto; background: #FFFFF5; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(17, 24, 39, 0.05); border: 1px solid rgba(17, 24, 39, 0.05); }
 .footer { text-align: center; font-size: 12px; color: #6B7280; padding-top: 24px; border-top: 1px solid rgba(17, 24, 39, 0.05); }
 .info-box { background: #F9FAFB; border: 1px solid rgba(17, 24, 39, 0.08); border-radius: 12px; padding: 16px; margin: 20px 0; border-left: 4px solid #142544; }
 </style>
</head>
<body>
 <div class="container">
 <h2 style="font-family: 'Inter', sans-serif, monospace; font-size:20px; color: #111827;"> New Milestone Created!</h2>
 <p style="color: #4B5563; font-size:15px;">
 Hi <strong th:text="${freelancerName}">Anika</strong>, a new milestone was created for your project <strong th:text="${projectTitle}">Project</strong>.
 </p>

 <div class="info-box">
 <p style="margin:0; font-size:14px; color: #4B5563; line-height: 1.6;">
 <strong>Milestone:</strong> <span th:text="${milestoneTitle}">Design Architecture</span><br>
 <strong>Weight:</strong> <span th:text="${weight}">20%</span><br>
 <strong>Deadline:</strong> <span th:text="${deadline}">TBD</span>
 </p>
 </div>

 <div class="footer">
 <p> <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
 </div>
 </div>
</body>
</html>
