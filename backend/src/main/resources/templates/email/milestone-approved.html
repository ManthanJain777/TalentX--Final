<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
 <title>Milestone Approved – TALENTX</title>
 <style>
 body { font-family: 'Inter', -apple-system, sans-serif; background: #FFFFF0; margin: 0; padding: 40px 20px; }
 .container { max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 60px rgba(17, 24, 39, 0.05); border: 1px solid rgba(17, 24, 39, 0.05); }
 .amount-box { background: linear-gradient(135deg, #142544, #0D1930); border-radius: 16px; padding: 24px; text-align: center; margin: 24px 0; }
 .amount { font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; color: #C7A868; }
 .btn { display: inline-block; background: #111827; color: white !important; padding: 12px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
 .footer { text-align: center; font-size: 12px; color: #6B7280; padding-top: 24px; border-top: 1px solid rgba(17, 24, 39, 0.05); }
 </style>
</head>
<body>
 <div class="container">
 <div style="text-align:center; margin-bottom:20px;">
 <div style="width:48px; height:48px; border-radius:50%; border:2px solid #C7A868; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; background: #FFFFF0;">
 <div style="width:14px; height:14px; border-radius:50%; background:#C7A868;"></div>
 </div>
 <h2 style="font-family: 'Inter', sans-serif, monospace; font-weight:700; font-size:24px; margin:0; color: #111827;">TALENT<span style="color:#8B6B23;">X</span></h2>
 </div>

 <h2 style="font-family: 'Inter', sans-serif, monospace; font-size:20px; color: #111827;"> Milestone Approved!</h2>
 <p style="color: #4B5563; font-size:15px;">
 Great work, <strong th:text="${freelancerName}">Anika</strong>! The milestone for <strong th:text="${projectTitle}">Project</strong> has been approved.
 </p>

 <div style="border-left:4px solid #1D8A5F; padding:12px 16px; background: #F9FAFB; border: 1px solid rgba(17, 24, 39, 0.08); border-radius:8px; margin:16px 0;">
 <p style="margin:0; font-size:14px; color: #4B5563;">
 <strong>Milestone:</strong> <span th:text="${milestoneTitle}">Design Architecture</span><br>
 <strong>Project Status:</strong> <span th:text="${projectStatus}">ACTIVE</span>
 </p>
 </div>

 <div class="amount-box">
 <p style="color:#C7A868; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">Funds Released</p>
 <div class="amount" th:text="${amount}">$2,900</div>
 <p style="color: #6B7280; font-size:12px; margin-top:8px;">
 Total Budget: <span th:text="${totalBudget}">$5,000</span>
 </p>
 </div>

 <div style="text-align:center; margin-top:20px;">
 <a href="#" th:href="${projectLink}" class="btn" style="border: 1px solid #C7A868;"> View Project Workspace</a>
 </div>

 <div class="footer">
 <p> <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
 </div>
 </div>
</body>
</html>
