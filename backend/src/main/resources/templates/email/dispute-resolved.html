<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
 <title>Dispute Resolved – TALENTX</title>
 <style>
 body { font-family: 'Inter', sans-serif; background: #050505; margin: 0; padding: 40px 20px; }
 .container { max-width: 520px; margin: 0 auto; background: #0A0A0B; border-radius: 20px; padding: 40px 32px; border-top: 6px solid #1D8A5F; box-shadow: 0 20px 60px rgba(199,168,104,0.15); }
 .footer { text-align: center; font-size: 12px; color: #71717A; padding-top: 24px; border-top: 1px solid rgba(199,168,104,0.15); }
 .info-box { background: #F2FCF7; border-radius: 12px; padding: 16px; margin: 20px 0; border: 1px solid #D1F0E0; }
 </style>
</head>
<body>
 <div class="container">
 <h2 style="font-family: 'Inter', sans-serif, monospace; font-size:20px; color:#1D8A5F;"> Dispute Resolved</h2>
 <p style="color: #A1A1AA; font-size:15px;">
 The dispute for the project <strong th:text="${projectTitle}">Project</strong> has been successfully resolved.
 </p>

 <div class="info-box">
 <p style="margin:0; font-size:14px; color: #A1A1AA; line-height: 1.6;">
 <strong>Original Issue:</strong> <span th:text="${disputeReason}">Quality</span><br>
 <strong>Resolution:</strong> <span th:text="${resolution}">Split Payment</span>
 </p>
 </div>

 <div class="footer">
 <p> <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
 </div>
 </div>
</body>
</html>
