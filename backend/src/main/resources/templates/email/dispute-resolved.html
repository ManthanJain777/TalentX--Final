<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dispute Resolved – TALENTX</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F3E8; margin: 0; padding: 40px 20px; }
        .container { max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; border-top: 6px solid #1D8A5F; box-shadow: 0 20px 60px rgba(20,37,68,0.06); }
        .footer { text-align: center; font-size: 12px; color: #93979F; padding-top: 24px; border-top: 1px solid rgba(20,37,68,0.06); }
        .info-box { background: #F2FCF7; border-radius: 12px; padding: 16px; margin: 20px 0; border: 1px solid #D1F0E0; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="font-family:'Georgia',serif; font-size:20px; color:#1D8A5F;">✅ Dispute Resolved</h2>
        <p style="color:#585D68; font-size:15px;">
            The dispute for the project <strong th:text="${projectTitle}">Project</strong> has been successfully resolved.
        </p>

        <div class="info-box">
            <p style="margin:0; font-size:14px; color:#585D68; line-height: 1.6;">
                <strong>Original Issue:</strong> <span th:text="${disputeReason}">Quality</span><br>
                <strong>Resolution:</strong> <span th:text="${resolution}">Split Payment</span>
            </p>
        </div>

        <div class="footer">
            <p>© <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
