<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dispute Raised – TALENTX</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #F7F3E8; margin: 0; padding: 40px 20px; }
        .container { max-width: 520px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; border-top: 6px solid #C0424D; box-shadow: 0 20px 60px rgba(20,37,68,0.06); }
        .footer { text-align: center; font-size: 12px; color: #93979F; padding-top: 24px; border-top: 1px solid rgba(20,37,68,0.06); }
        .info-box { background: #FFF5F5; border-radius: 12px; padding: 16px; margin: 20px 0; border: 1px solid #FDD8D8; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="font-family:'Georgia',serif; font-size:20px; color:#C0424D;">⚖️ Dispute Raised</h2>
        <p style="color:#585D68; font-size:15px;">
            A dispute has been raised for the project <strong th:text="${projectTitle}">Project</strong> by <strong th:text="${raiserName}">User</strong>.
        </p>

        <div class="info-box">
            <p style="margin:0; font-size:14px; color:#585D68; line-height: 1.6;">
                <strong>Reason:</strong> <span th:text="${disputeReason}">Quality</span><br>
                <strong>Description:</strong> <span th:text="${disputeDescription}">...</span>
            </p>
        </div>

        <p style="color:#585D68; font-size:14px;">
            Our arbitration team is reviewing the case. You will be notified of any updates.
        </p>

        <div class="footer">
            <p>© <span th:text="${currentYear}">2026</span> TALENTX. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
